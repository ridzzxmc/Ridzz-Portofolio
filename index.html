<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ridzz — Modpack Portfolio</title>
<link rel="icon" href="vulkanized-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<!--
  ====================================================================
  CARA EDIT CEPAT (baca ini dulu sebelum ubah apa-apa)
  ====================================================================
  Semua data (nama, bio, daftar modpack, galeri, changelog, versi,
  link download, link sosial) ada di satu tempat: cari komentar
  "DATA WEBSITE" di bagian <script> paling bawah file ini.

  1) FOTO PROFIL
     Taruh foto asli kamu di folder yang sama dengan nama file
     "ridzzfotoprofil.png" (bukan avatar Minecraft lagi). Kalau nama
     file foto kamu beda, ganti juga nilai `user.avatar` di data.

  2) LINK SOSIAL & DONASI (TikTok, YouTube, Saluran WhatsApp, Donasi)
     Sudah diisi dengan link asli kamu di `socials`. Tombol pertama
     ("donate") otomatis tampil sebagai pill emas menonjol di atas
     ikon sosial lain. Mau ganti link mana pun, tinggal edit `url`
     pada entri terkait di `socials`.

  3) LINK DOWNLOAD MEDIAFIRE
     Cari `versions` di data modpack. Setiap versi game (mis. "1.21.11")
     berisi satu link `downloadUrl` ke Mediafire. Tinggal ganti "#"
     dengan link Mediafire asli kamu.

  4) TAMBAH VERSI MODPACK BARU (tanpa perlu minta dibuatkan lagi)
     Salin blok versi yang sudah ada di dalam `versions`, ganti nama
     versinya, nama file, dan link Mediafire-nya. Contoh ada di
     komentar tepat di atas objek `versions`.

  5) FOTO SETTING KHUSUS (biar modpack jalan stabil)
     Sudah disiapkan 2 slot khusus di `specialSettings`: "special-setting-1.png"
     dan "special-setting-2.png". Taruh 2 screenshot setting (video setting,
     Java args/alokasi RAM, dsb) yang WAJIB dipakai biar modpack stabil, di
     folder yang sama dengan file index.html ini, dengan nama persis seperti
     itu. Ini tampil paling atas di tab Gallery, sebelum foto perbandingan FPS.

  6) TAMBAH FOTO GALERI (perbandingan FPS tanpa vs pakai modpack)
     Sudah disiapkan 2 slot di `gallery`: "fps-tanpa-modpack.jpg" dan
     "fps-pakai-modpack.jpg". Taruh 2 foto itu di folder yang sama dengan
     file index.html ini, dengan nama persis seperti itu, fotonya langsung
     tampil otomatis.

  7) TAMBAH MODPACK BARU
     Salin seluruh objek modpack (dari "{" sampai "}") lalu tempel
     sebagai anggota baru di array `modpacks`, dan ganti isinya.

  8) STATISTIK DOWNLOAD & LIKE (REAL-TIME)
     Angka download & like sekarang otomatis tersimpan online lewat
     layanan counter gratis (bukan cuma di HP kamu saja) — jadi semua
     orang yang buka halaman ini lihat angka yang sama & selalu update.
     Ini pakai layanan pihak ketiga gratis, jadi kalau suatu saat
     layanannya bermasalah, angka tetap tampil (versi terakhir yang
     tersimpan) dan situs tidak akan error.
  ====================================================================
-->

<style>
  :root{
    --bg:#0d0d0d;
    --surface:#161616;
    --surface-2:#1c1c1c;
    --surface-hover:#232323;
    --border:#262626;
    --border-soft:#1f1f1f;
    --text:#f3f1ef;
    --text-dim:#9c9894;
    --text-faint:#6f6b67;
    --red:#ff2d43;
    --red-bright:#ff5468;
    --red-hover:#ff4258;
    --red-dim:#5c1119;
    --red-glow:rgba(255,45,67,.32);
    --red-glow-soft:rgba(255,45,67,.16);
    --red-glow-strong:rgba(255,45,67,.55);
    --grad-red:linear-gradient(135deg, #1a0509 0%, var(--red) 62%, var(--red-bright) 100%);
    --grad-hero:linear-gradient(180deg, rgba(120,8,20,.4), transparent 75%);
    --radius-lg:20px;
    --radius:14px;
    --radius-sm:10px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  *{ box-sizing:border-box; }
  html{ -webkit-tap-highlight-color:transparent; }

  /* ---------- animasi umum ---------- */
  @keyframes viewFade{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes heroPulse{
    0%,100%{ opacity:.5; }
    50%{ opacity:.85; }
  }
  @keyframes glowPulse{
    0%,100%{ text-shadow:0 0 8px var(--red-glow), 0 0 18px var(--red-glow); }
    50%{ text-shadow:0 0 16px var(--red-glow-strong), 0 0 36px var(--red-glow-strong); }
  }
  @keyframes btnGlow{
    0%,100%{ box-shadow:0 4px 14px var(--red-glow); }
    50%{ box-shadow:0 4px 22px var(--red-glow-strong); }
  }
  @keyframes shimmer{
    0%{ transform:translateX(-120%) skewX(-15deg); }
    100%{ transform:translateX(220%) skewX(-15deg); }
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(14px) scale(.985); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes popIn{
    from{ opacity:0; transform:scale(.9); }
    to{ opacity:1; transform:scale(1); }
  }
  .name-glow{
    color:var(--red-bright);
    text-shadow:0 0 8px var(--red-glow), 0 0 18px var(--red-glow);
    animation:glowPulse 3.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion:reduce){
    .name-glow{ animation:none; }
    .view.active, .tab-panel.active{ animation:none !important; }
    .profile-hero::before, .detail-hero::before{ animation:none !important; }
    .social-donate, .btn-primary{ animation:none !important; }
    .mp-card{ animation:none !important; }
    .social-row a::after, .btn-primary::after, .mp-card::after,
    .file-download-btn::after, .icon-btn::after{ display:none !important; }
  }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:#050505;
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img{ display:block; max-width:100%; }
  button{ font-family:inherit; }
  a{ color:inherit; text-decoration:none; }
  hr.divider{ border:none; border-top:1px solid var(--border); margin:0; }
  code{ background:var(--surface-2); padding:2px 6px; border-radius:6px; font-size:.85em; }

  :focus-visible{ outline:2px solid var(--red); outline-offset:2px; }

  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    border-left:1px solid var(--border);
    border-right:1px solid var(--border);
    position:relative;
    overflow:hidden;
    animation:viewFade .5s var(--ease);
  }
  .app::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--red) 50%, transparent);
    opacity:.75;
    z-index:5;
    pointer-events:none;
  }
  @media (max-width:640px){
    .app{ border-left:none; border-right:none; }
  }

  .view{ display:none; }
  .view.active{ display:block; animation:viewFade .4s cubic-bezier(.22,.61,.36,1); }

  /* ---------- icon buttons ---------- */
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:50%;
    color:var(--text-dim);
    cursor:pointer;
    transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease), box-shadow .25s var(--ease);
    position:relative;
    overflow:hidden;
  }
  .icon-btn::after{
    content:"";
    position:absolute; top:0; bottom:0; left:0; width:50%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,.08), transparent);
    animation:shimmer 3.8s ease-in-out infinite;
    pointer-events:none;
  }
  .icon-btn:hover{ background:var(--surface-hover); color:var(--text); transform:translateY(-1px); box-shadow:0 0 0 1px var(--red-dim), 0 4px 16px var(--red-glow-soft); }
  .icon-btn:active{ transform:scale(.92); }
  .icon-btn svg{ width:18px; height:18px; transition:transform .25s var(--ease); }
  .icon-btn.active{ color:var(--red); border-color:var(--red-dim); background:rgba(239,43,62,.08); box-shadow:0 0 14px var(--red-glow-soft); }
  .icon-btn.active svg{ transform:scale(1.1); }

  /* ================= PROFILE PAGE ================= */
  .profile-hero{
    position:relative;
    padding:28px 20px 18px;
    overflow:hidden;
    background:var(--grad-hero);
  }
  .profile-hero::before{
    content:"";
    position:absolute;
    top:-60px; left:-40px; right:-40px; height:180px;
    background:radial-gradient(circle at 25% 20%, var(--red-glow), transparent 70%);
    filter:blur(30px);
    opacity:.55;
    pointer-events:none;
    animation:heroPulse 5s ease-in-out infinite;
  }
  .profile-top{
    position:relative;
    display:flex; align-items:flex-start; justify-content:space-between;
  }
  .avatar{
    width:68px; height:68px; border-radius:50%;
    object-fit:cover;
    border:2px solid var(--border);
    background:var(--surface);
    transition:border-color .25s var(--ease), transform .25s var(--ease);
  }
  .avatar:hover{ border-color:var(--red-dim); transform:scale(1.04); }
  .profile-name{
    position:relative;
    margin:14px 0 4px;
    font-size:26px;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .profile-bio{
    position:relative;
    margin:0 0 14px;
    color:var(--text-dim);
    font-size:14.5px;
    line-height:1.4;
  }
  .social-row{
    position:relative;
    display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;
  }
  .social-row a{
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px;
    background:var(--grad-red);
    border:none;
    border-radius:50%;
    color:#fff;
    box-shadow:0 4px 14px var(--red-glow);
    transition:background .2s var(--ease), transform .2s var(--ease), box-shadow .25s var(--ease);
    position:relative;
    overflow:hidden;
  }
  .social-row a:hover{ background:linear-gradient(135deg, var(--red), var(--red-bright)); transform:translateY(-2px); box-shadow:0 6px 22px var(--red-glow-strong); }
  .social-row a:active{ transform:translateY(0) scale(.94); }
  .social-row svg{ width:18px; height:18px; }
  .social-row a::after{
    content:"";
    position:absolute; top:0; bottom:0; left:0; width:45%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,.4), transparent);
    animation:shimmer 3.4s ease-in-out infinite;
    pointer-events:none;
  }
  .social-row a:nth-child(1)::after{ animation-delay:0s; }
  .social-row a:nth-child(2)::after{ animation-delay:.5s; }
  .social-row a:nth-child(3)::after{ animation-delay:1s; }
  .social-row a:nth-child(4)::after{ animation-delay:1.5s; }

  /* tombol donasi — tetap merah senada, dibedakan lewat bentuk pill saja (bukan lewat efek kinclong) */
  .social-row a.social-donate{
    width:auto;
    padding:0 16px 0 13px;
    gap:7px;
    border-radius:999px;
    box-shadow:0 4px 16px var(--red-glow);
    font-size:13.5px;
    font-weight:700;
    white-space:nowrap;
    animation:btnGlow 3s ease-in-out infinite;
  }
  .social-row a.social-donate:hover{ background:linear-gradient(135deg, var(--red), var(--red-bright)); transform:translateY(-2px); box-shadow:0 6px 24px var(--red-glow-strong); }
  .social-row a.social-donate svg{ width:16px; height:16px; }
  .social-row a.social-donate span{ position:relative; z-index:1; }

  .stat-row{
    position:relative;
    display:flex; align-items:center; gap:8px;
    color:var(--text-dim);
    font-size:13.5px;
    margin-top:6px;
  }
  .stat{ display:inline-flex; align-items:center; gap:5px; }
  .stat svg{ width:15px; height:15px; }
  .stat-dot{ color:var(--text-faint); }

  /* profile menu popover */
  .menu-wrap{ position:relative; }
  .popover{
    position:absolute; right:0; top:44px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    min-width:190px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    z-index:40;
    overflow:hidden;
    display:none;
    transform-origin:top right;
  }
  .popover.open{ display:block; animation:popIn .18s var(--ease); }
  .popover button{
    display:flex; align-items:center; gap:10px;
    width:100%; padding:11px 14px;
    background:none; border:none; color:var(--text);
    font-size:14px; text-align:left; cursor:pointer;
    transition:background .15s ease, padding-left .15s ease;
  }
  .popover button:hover{ background:var(--surface-hover); padding-left:17px; }
  .popover svg{ width:16px; height:16px; color:var(--text-dim); }

  /* ---------- modpack list ---------- */
  .modpack-list{ padding:14px 14px 40px; display:flex; flex-direction:column; gap:12px; }
  .mp-card{
    display:flex; gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    cursor:pointer;
    transition:background .25s var(--ease), border-color .25s var(--ease), transform .2s var(--ease), box-shadow .25s var(--ease);
    text-align:left;
    width:100%;
    animation:cardIn .5s var(--ease) both;
    position:relative;
    overflow:hidden;
  }
  .mp-card::after{
    content:"";
    position:absolute; top:0; bottom:0; left:0; width:35%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,.06), transparent);
    animation:shimmer 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  .mp-card:nth-child(odd)::after{ animation-delay:0s; }
  .mp-card:nth-child(even)::after{ animation-delay:1.6s; }
  .mp-card:hover{ background:var(--surface-2); border-color:var(--red-dim); box-shadow:0 10px 26px rgba(0,0,0,.4), 0 0 0 1px rgba(255,45,67,.1); transform:translateY(-3px); }
  .mp-card:active{ transform:scale(.985); }
  .mp-thumb{ transition:transform .3s var(--ease); }
  .mp-card:hover .mp-thumb{ transform:scale(1.05); }
  .mp-thumb{
    width:64px; height:64px; border-radius:var(--radius-sm);
    object-fit:cover; flex-shrink:0; background:var(--surface-2);
    border:1px solid var(--border);
  }
  .mp-info{ min-width:0; flex:1; }
  .mp-name{ margin:0 0 4px; font-size:15.5px; font-weight:700; }
  .mp-desc{
    margin:0 0 8px; font-size:13px; color:var(--text-dim); line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .mp-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .tag{
    font-size:11px; font-weight:600; padding:3px 9px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:999px; color:var(--text-dim); white-space:nowrap;
  }
  .mp-stats{ display:flex; gap:12px; font-size:12px; color:var(--text-faint); }
  .mp-stats span{ display:inline-flex; align-items:center; gap:4px; }
  .mp-stats svg{ width:13px; height:13px; }

  /* ================= DETAIL PAGE ================= */
  .detail-topbar{ padding:14px 16px 0; }
  .back-btn{
    display:inline-flex; align-items:center; gap:4px;
    background:none; border:none; color:var(--text-dim);
    font-size:14px; font-weight:600; cursor:pointer; padding:6px 4px;
  }
  .back-btn:hover{ color:var(--text); }
  .back-btn svg{ width:18px; height:18px; }

  .detail-hero{ position:relative; padding:14px 20px 20px; overflow:hidden; background:var(--grad-hero); }
  .detail-hero::before{
    content:"";
    position:absolute; top:-50px; left:-40px; right:-40px; height:200px;
    background:radial-gradient(circle at 20% 15%, var(--red-glow), transparent 70%);
    filter:blur(34px); opacity:.5; pointer-events:none;
  }
  .mp-icon-lg{
    position:relative;
    width:88px; height:88px; border-radius:var(--radius);
    object-fit:cover; border:1px solid var(--border); background:var(--surface);
  }
  .detail-name{ position:relative; margin:16px 0 6px; font-size:25px; font-weight:800; letter-spacing:-.01em; }
  .detail-desc{ position:relative; margin:0 0 18px; color:var(--text-dim); font-size:14.5px; line-height:1.5; max-width:65ch; }

  .action-row{ position:relative; display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .btn-primary{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--grad-red); color:#fff; border:none;
    padding:11px 20px; border-radius:999px;
    font-size:14.5px; font-weight:700; cursor:pointer;
    transition:background .2s var(--ease), transform .15s var(--ease), box-shadow .25s var(--ease);
    box-shadow:0 4px 18px var(--red-glow);
    animation:btnGlow 2.8s ease-in-out infinite;
    position:relative;
    overflow:hidden;
  }
  .btn-primary::after{
    content:"";
    position:absolute; top:0; bottom:0; left:0; width:45%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,.4), transparent);
    animation:shimmer 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  .btn-primary svg{ width:17px; height:17px; }
  .btn-primary:hover{ background:linear-gradient(135deg, var(--red), var(--red-bright)); box-shadow:0 6px 26px var(--red-glow-strong); transform:translateY(-1px); }
  .btn-primary:active{ transform:scale(.98); }

  .detail-hero .stat-row{ margin-top:2px; }

  /* ---------- tabs ---------- */
  .tabs{
    display:flex; gap:4px; padding:0 12px;
    overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    background:none; border:none; color:var(--text-dim);
    font-size:14px; font-weight:600; padding:12px 12px;
    cursor:pointer; white-space:nowrap;
    border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover{ color:var(--text); }
  .tab-btn.active{ color:var(--red); border-color:var(--red); text-shadow:0 0 12px var(--red-glow-soft); }

  .tab-panel{ display:none; padding:18px 20px 50px; }
  .tab-panel.active{ display:block; animation:viewFade .35s ease; }

  .desc-text{ color:var(--text-dim); font-size:14.5px; line-height:1.7; white-space:pre-line; max-width:65ch; }

  /* gallery */
  .gallery-section-title{
    display:flex; align-items:center; gap:8px;
    margin:0 0 14px; font-size:12.5px; font-weight:700;
    letter-spacing:.04em; text-transform:uppercase; color:var(--red-bright);
  }
  .gallery-section-title svg{ width:15px; height:15px; }
  .gallery-section{ margin-bottom:28px; }
  .gallery-section:last-child{ margin-bottom:0; }
  .gallery-grid{ display:flex; flex-direction:column; gap:16px; }
  .gallery-item img{
    width:100%; border-radius:var(--radius);
    border:1px solid var(--border); background:var(--surface);
    aspect-ratio:16/9; object-fit:cover;
  }
  .gallery-img-error{
    width:100%; aspect-ratio:16/9; border-radius:var(--radius);
    border:1px dashed var(--border); background:var(--surface);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; color:var(--text-faint); font-size:12.5px; text-align:center; padding:12px;
  }
  .gallery-img-error svg{ width:26px; height:26px; opacity:.6; }
  .gallery-item h4{ margin:10px 0 3px; font-size:14.5px; font-weight:700; }
  .gallery-item p{ margin:0 0 6px; font-size:13px; color:var(--text-dim); line-height:1.5; }
  .gallery-date{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--text-faint); }
  .gallery-date svg{ width:13px; height:13px; }

  .empty-state{
    text-align:center; padding:44px 20px; color:var(--text-faint);
  }
  .empty-state svg{ width:34px; height:34px; margin-bottom:12px; opacity:.6; }
  .empty-state p{ font-size:13.5px; line-height:1.6; max-width:36ch; margin:0 auto; }

  /* changelog */
  .changelog-entry{ padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--border-soft); }
  .changelog-entry:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .changelog-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .changelog-version{
    font-size:13px; font-weight:700; color:var(--red);
    background:rgba(239,43,62,.1); border:1px solid var(--red-dim);
    padding:2px 10px; border-radius:999px;
  }
  .changelog-date{ font-size:12.5px; color:var(--text-faint); }
  .changelog-entry ul{ margin:0; padding-left:18px; color:var(--text-dim); font-size:14px; line-height:1.7; }

  /* versi tab */
  .version-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    margin-bottom:10px;
  }
  .version-row .vname{ font-weight:700; font-size:14.5px; }
  .version-row .vloader{
    font-size:12px; color:var(--text-dim);
    display:inline-flex; align-items:center; gap:5px;
  }
  .version-row .vloader svg{ width:13px; height:13px; }

  /* ================= MODAL ================= */
  .modal-overlay{
    position:fixed; inset:0;

/* ---------- statistik real-time (download & like) ----------
   Memakai layanan counter gratis pihak ketiga (tanpa perlu server
   sendiri) supaya angka download & like sama untuk semua orang dan
   selalu update. Kalau layanan ini suatu saat tidak bisa diakses,
   kodenya otomatis "jatuh" ke angka lokal terakhir, jadi web tidak
   akan error atau nge-blank. */
const COUNTER_API = "https://countapi.mileshilliard.com/api/v1";

function counterKey(slug, type){
  return `ridzzxmc-${slug}-${type}`.toLowerCase().replace(/[^a-z0-9_\-.]/g, '-');
}
async function counterGet(key){
  try{
    const res = await fetch(`${COUNTER_API}/get/${key}`);
    if(!res.ok) return 0; // key belum pernah dipakai -> anggap 0
    const data = await res.json();
    return parseInt(data.value, 10) || 0;
  }catch(e){ return null; } // null = gagal konek, jangan timpa angka lokal
}
async function counterHit(key){
  try{
    const res = await fetch(`${COUNTER_API}/hit/${key}`);
    if(!res.ok) return null;
    const data = await res.json();
    return parseInt(data.value, 10);
  }catch(e){ return null; }
}
async function counterSet(key, value){
  try{
    const res = await fetch(`${COUNTER_API}/set/${key}?value=${value}`);
    if(!res.ok) return null;
    const data = await res.json();
    return parseInt(data.value, 10);
  }catch(e){ return null; }
}
async function syncModpackStats(m){
  const [dl, fw] = await Promise.all([
    counterGet(counterKey(m.slug, 'downloads')),
    counterGet(counterKey(m.slug, 'likes'))
  ]);
  if(dl !== null) m.downloads = dl;
  if(fw !== null) m.followers = fw;
}
async function refreshStatsAndRerender(){
  await Promise.all(siteData.modpacks.map(syncModpackStats));
  renderProfile();
  if(activeSlug) renderDetail(activeSlug);
}

  $('#socialRow').innerHTML = u.socials.map(s => {
    const isDonate = s.icon === 'donate';
    const icon = isDonate ? iconSvg('gift') : brandIconSvg(s.icon);
    return `<a href="${s.url}" target="_blank" rel="noopener" class="${isDonate ? 'social-donate' : ''}" aria-label="${s.label}" title="${s.label}">${icon}${isDonate ? `<span>${s.label}</span>` : ''}</a>`;
  }).join('');

  $('#modpackList').innerHTML = siteData.modpacks.map((m, i) => `
    <button class="mp-card" data-slug="${m.slug}" style="animation-delay:${i * 70}ms">
      <img class="mp-thumb" src="${m.icon}" alt="">
      <div class="mp-info">
        <h3 class="mp-name name-glow">${m.name}</h3>
        <p class="mp-desc">${m.shortDesc}</p>
        <div class="mp-tags">${m.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="mp-stats">
          <span>${iconSvg('download')}${m.downloads}</span>
          <span>${iconSvg('heart')}${m.followers}</span>
          <span>${iconSvg('clock')}${m.updatedLabel}</span>
        </div>
      </div>
    </button>
  `).join('');

  $$('.mp-card').forEach(card => {
    card.addEventListener('click', () => navigateTo(card.dataset.slug));
  });

  safeCreateIcons();
}

/* ---------- render: detail modpack ---------- */
function renderDetail(slug){
  const m = findModpack(slug);
  if(!m) return;
  activeSlug = slug;

  $('#dIcon').src = m.icon;
  $('#dName').textContent = m.name;
  $('#dDesc').textContent = m.shortDesc;
  $('#dDownloads').textContent = `${m.downloads} downloads`;
  $('#dFollowers').textContent = `${m.followers} followers`;

  $('#followBtn').classList.toggle('active', m.isFollowing);
  $('#saveBtn').classList.toggle('active', m.isSaved);

  // tab: description
  $('#panel-description').innerHTML = `<p class="desc-text">${m.longDesc}</p>`;

  // tab: gallery — bagian "special settings" (setting wajib biar stabil)
  // tampil dulu di paling atas, baru di bawahnya perbandingan FPS.
  const settingsHtml = (m.specialSettings && m.specialSettings.length > 0) ? `
    <div class="gallery-section">
      <h3 class="gallery-section-title">${iconSvg('settings-2')}Special Settings for Stable Performance</h3>
      <div class="gallery-grid">${m.specialSettings.map(g => `
        <div class="gallery-item">
          <img src="${g.img}" alt="${g.title}" onerror="handleImgError(this)">
          <h4>${g.title}</h4>
          <p>${g.desc}</p>
        </div>
      `).join('')}</div>
    </div>` : '';

  if(m.gallery.length === 0 && (!m.specialSettings || m.specialSettings.length === 0)){
    $('#panel-gallery').innerHTML = `
      <div class="empty-state">
        ${iconSvg('image')}
        <p>No screenshots yet for ${m.name}. Add them via the <code>gallery</code> array in the modpack data code.</p>
      </div>`;
  } else {
    const fpsHtml = m.gallery.length > 0 ? `
      <div class="gallery-section">
        ${settingsHtml ? `<h3 class="gallery-section-title">${iconSvg('bar-chart-3')}FPS Comparison</h3>` : ''}
        <div class="gallery-grid">${m.gallery.map(g => `
          <div class="gallery-item">
            <img src="${g.img}" alt="${g.title}" onerror="handleImgError(this)">
            <h4>${g.title}</h4>
            <p>${g.desc}</p>
            <span class="gallery-date">${iconSvg('calendar')}${g.date}</span>
          </div>
        `).join('')}</div>
      </div>` : '';
    $('#panel-gallery').innerHTML = settingsHtml + fpsHtml;
  }

  // tab: changelog
  $('#panel-changelog').innerHTML = m.changelog.map(c => `
    <div class="changelog-entry">
      <div class="changelog-head">
        <span class="changelog-version">v${c.version}</span>
        <span class="changelog-date">${c.date}</span>
      </div>
      <ul>${c.notes.map(n => `<li>${n}</li>`).join('')}</ul>
    </div>
  `).join('');

  // tab: versions
  $('#panel-versions').innerHTML = Object.keys(m.versions).map(v => `
    <div class="version-row">
      <span class="vname">${v}</span>
      <span class="vloader">${iconSvg('wrench')}${m.loader}</span>
    </div>
  `).join('');

  safeCreateIcons();
}

/* ---------- tabs ---------- */
function setupTabs(){
  $$('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.tab-btn').forEach(b => b.classList.remove('active'));
      $$('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      $(`#panel-${btn.dataset.tab}`).classList.add('active');
    });
  });
}

/* ---------- routing ---------- */
function canUseHistoryApi(){
  return window.location.protocol.startsWith('http');
}

function showView(viewId){
  $$('.view').forEach(v => v.classList.remove('active'));
  $(`#${viewId}`).classList.add('active');
  window.scrollTo(0, 0);
}

function navigateTo(slug, push = true){
  renderDetail(slug);
  showView('view-detail');
  if(push && canUseHistoryApi()){
    history.pushState({ slug }, '', `/modpack/${slug}`);
  }
}

function navigateHome(push = true){
  showView('view-profile');
  if(push && canUseHistoryApi()){
    history.pushState({}, '', '/');
  }
}

window.addEventListener('popstate', (e) => {
  const path = window.location.pathname;
  const match = path.match(/^\/modpack\/(.+)$/);
  if(match && findModpack(match[1])){
    navigateTo(match[1], false);
  } else {
    navigateHome(false);
  }
});

/* ---------- popovers (menu titik tiga) ---------- */
function setupPopover(btnId, popId){
  const btn = $(`#${btnId}`), pop = $(`#${popId}`);
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    pop.classList.toggle('open');
  });
  document.addEventListener('click', () => pop.classList.remove('open'));
  pop.addEventListener('click', (e) => e.stopPropagation());
}

/* ---------- follow / save toggle ---------- */
function setupActionToggles(){
  $('#followBtn').addEventListener('click', async () => {
    const m = findModpack(activeSlug);
    const willFollow = !m.isFollowing;
    m.isFollowing = willFollow;
    $('#followBtn').classList.toggle('active', willFollow); // update instan, tidak nunggu jaringan
    const key = counterKey(m.slug, 'likes');
    const newVal = willFollow
      ? await counterHit(key)
      : await counterSet(key, Math.max(0, (m.followers || 0) - 1));
    m.followers = (newVal !== null) ? newVal : Math.max(0, m.followers + (willFollow ? 1 : -1));
    renderDetail(activeSlug);
  });
  $('#saveBtn').addEventListener('click', () => {
    const m = findModpack(activeSlug);
    m.isSaved = !m.isSaved;
    $('#saveBtn').classList.toggle('active', m.isSaved);
  });
}

/* ---------- copy link helpers ---------- */
function copyText(text){
  if(navigator.clipboard){ navigator.clipboard.writeText(text); }
}

/* ---------- modal: pilih versi download ---------- */
function openModal(slug){
  const m = findModpack(slug);
  $('#sheetIcon').src = m.icon;
  $('#sheetTitle').textContent = `Download ${m.name}`;

  const versionKeys = Object.keys(m.versions);
  selectedVersion = versionKeys[0];

  $('#versionDropdownList').innerHTML = versionKeys.map(v => `
    <button data-version="${v}" class="${v === selectedVersion ? 'selected' : ''}">${v}</button>
  `).join('');
  $('#versionDropdownLabel').textContent = selectedVersion;

  $$('#versionDropdownList button').forEach(b => {
    b.addEventListener('click', () => {
      selectedVersion = b.dataset.version;
      $('#versionDropdownLabel').textContent = selectedVersion;
      $$('#versionDropdownList button').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      $('#versionDropdownList').classList.remove('open');
      $('#versionDropdownBtn').classList.remove('open');
      renderFileList(m, selectedVersion);
    });
  });

  renderFileList(m, selectedVersion);

  $('#modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  safeCreateIcons();
}

function renderFileList(m, version){
  const files = m.versions[version] || [];
  $('#fileList').innerHTML = files.map(f => `
    <a class="file-download-btn" href="${f.downloadUrl}" target="_blank" rel="noopener" data-slug="${m.slug}">
      <div class="file-meta">
        <div class="file-name">${f.filename}</div>
        <div class="file-version">Version ${f.version} • via Mediafire</div>
      </div>
      <span class="file-go">${iconSvg('arrow-down-to-line')}</span>
    </a>
  `).join('');
  $$('#fileList .file-download-btn').forEach(a => {
    a.addEventListener('click', () => handleDownloadClick(a.dataset.slug));
  });
  safeCreateIcons();
}

/* Tercatat begitu tombol download diklik (sebelum pindah ke Mediafire),
   lalu angkanya disinkronkan lagi lewat layanan counter. */
async function handleDownloadClick(slug){
  const m = findModpack(slug);
  if(!m) return;
  const newVal = await counterHit(counterKey(slug, 'downloads'));
  m.downloads = (newVal !== null) ? newVal : m.downloads + 1;
  renderProfile();
  if(activeSlug === slug) renderDetail(slug);
}

function closeModal(){
  $('#modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  $('#versionDropdownList').classList.remove('open');
  $('#versionDropdownBtn').classList.remove('open');
}

/* ---------- init ---------- */
function init(){
  renderProfile();
  setupTabs();
  setupPopover('profileMenuBtn', 'profilePopover');
  setupPopover('detailMenuBtn', 'detailPopover');
  setupActionToggles();

  $('#backBtn').addEventListener('click', () => navigateHome());
  $('#downloadBtn').addEventListener('click', () => openModal(activeSlug));
  $('#closeModalBtn').addEventListener('click', closeModal);
  $('#modalOverlay').addEventListener('click', (e) => {
    if(e.target === $('#modalOverlay')) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeModal();
  });

  $('#versionDropdownBtn').addEventListener('click', () => {
    $('#versionDropdownList').classList.toggle('open');
    $('#versionDropdownBtn').classList.toggle('open');
  });

  $('#copyProfileLink').addEventListener('click', () => {
    copyText(window.location.origin + '/');
  });
  $('#shareProfile').addEventListener('click', () => {
    if(navigator.share){ navigator.share({ title: siteData.user.name, url: window.location.origin + '/' }); }
    else { copyText(window.location.origin + '/'); }
  });
  $('#copyModpackLink').addEventListener('click', () => {
    copyText(window.location.origin + '/modpack/' + activeSlug);
  });

  // routing awal berdasarkan URL saat halaman dibuka
  const path = window.location.pathname;
  const match = path.match(/^\/modpack\/(.+)$/);
  if(match && findModpack(match[1])){
    navigateTo(match[1], false);
  } else {
    navigateHome(false);
  }

  // Ambil angka download & like terbaru dari layanan counter tanpa
  // memblokir tampilan awal (halaman tetap langsung muncul).
  refreshStatsAndRerender();
}

init();
</script>
